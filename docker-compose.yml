# Default to the isolated local development instance.
services:
  sun-panel-dev:
    build:
      context: .
    image: usagi/sun-panel:dev
    container_name: sun-panel-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3002"
    volumes:
      - ./conf:/app/conf
      - ./conf/uploads:/app/uploads
      - ./conf/database:/app/database
      - ./conf/custom:/app/web/custom
      - ./conf/favicon.ico:/app/web/favicon.ico:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"
